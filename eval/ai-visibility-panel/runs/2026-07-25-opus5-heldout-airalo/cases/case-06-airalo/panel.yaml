waivers:
  - waiver_id: "W-001"
    subject: "Unaided cell count below the diagnostic default"
    detail: "25 unaided canonical cells against a 30-48 default."
    reason: "The retrieved evidence does not support more distinct unaided intents. Adding cells would mean inventing personas, locales or information acts."
    evidence_needed: "Authorised customer conversations, on-site search or query data, or reachable review and community corpora."
    expires: "2026-10-25"
  - waiver_id: "W-002"
    subject: "Partner, reseller and affiliate area excluded"
    detail: "No cell covers the partner or reseller programme named on the target site."
    reason: "Company-asserted evidence only (source-001, source-002); no independent or behavioural support."
    evidence_needed: "Independent partner-side sources or authorised customer evidence."
    expires: "2026-10-25"
  - waiver_id: "W-003"
    subject: "Loyalty, referral and stored-value area excluded"
    detail: "No cell covers the loyalty, referral or stored-value programme."
    reason: "Company-asserted only, and campaign-adjacent terms are held out of unaided measurement."
    evidence_needed: "Buyer-language evidence that these programmes drive an information need."
    expires: "2026-10-25"
  - waiver_id: "W-004"
    subject: "Non-English locales excluded"
    detail: "No cell exists in any non-English locale."
    reason: "No non-English buyer-language evidence and no native or market-competent reviewer."
    evidence_needed: "Locale-specific evidence plus a named reviewer per locale."
    expires: "2026-10-25"
  - waiver_id: "W-005"
    subject: "Grade-C cells inside core"
    detail: "cell-007, cell-012 and cell-013 sit in core on grade-C evidence."
    reason: "The underlying intents are well-attested in shape but their sources are title-only proxies or inference."
    evidence_needed: "A behavioural or independent source per cell, or demotion to rotating at Gate 3."
    expires: "2026-10-25"
  - waiver_id: "W-006"
    subject: "Consumer surface limited to sentinels"
    detail: "Only the 4 sentinel cells run on surface-consumer-clean."
    reason: "Manual collection cost."
    evidence_needed: "An approved collection budget."
    expires: "2026-10-25"
  - waiver_id: "W-007"
    subject: "Global-package area only partially covered"
    detail: "Global multi-region plans are measured only through cell-033."
    reason: "No independent or behavioural buyer language specific to global plans."
    evidence_needed: "Forum or review language from travellers selecting a global plan."
    expires: "2026-10-25"

budget:
  observations_per_wave_estimate: 639
  calculation: "prompt-021a is retrieval-only: 1 surface x 3 repeats = 3. The 8 sentinel candidates run 3 API surfaces x 6 repeats = 144, plus surface-consumer-clean at 3 repeats = 24, so 168. The remaining 52 candidates run 3 API surfaces x 3 repeats = 468. Total 3 + 168 + 468 = 639, before retries."
  budget_status: "provisional_estimate_not_approved"
