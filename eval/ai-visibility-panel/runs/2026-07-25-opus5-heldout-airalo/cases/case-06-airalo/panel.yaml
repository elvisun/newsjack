model_search_session_policy:
  model_version_recording: "Record the provider-exposed model and version string on every observation; a version change opens a new configuration and is flagged as drift."
  search_policy: "closed_model surfaces run with tools and retrieval disabled. surface-retrieval-a runs with retrieval allowed and records retrieval_used, generated queries when exposed, and citation metadata."
  session_state: "Fresh session per observation. No conversation carry-over except inside a scripted multi-turn candidate, which runs both turns in one session."
  personalization: "surface-consumer-clean runs logged out or on a declared clean archetype with history cleared. Consumer-surface observations are never rolled up with API observations."
  system_prompt: "Fixed and minimal, recorded verbatim in the run manifest."
  sampling: "Temperature and any sampling controls fixed per wave and recorded."

repetitions:
  core_per_candidate_per_surface: 3
  sentinel_per_candidate_per_surface: 6
  rotating_per_candidate_per_surface: 3
  control_per_candidate_per_surface: 3
  aided_per_candidate_per_surface: 3
  basis: "Defaults from the diagnostic tier. They are not pilot-derived and must be revisited after the variance pilot."

randomization:
  seed: 20260725
  method: "Randomize candidate order within each wave and interleave surfaces so that time-of-day effects do not align with a partition."
  time_blocks_per_wave: 2

controls:
  off_category_control_cell: "cell-025"
  purpose: "Estimate unprompted category and brand injection when no connectivity need is expressed."
  fresh_session_control: "Every observation opens a fresh session; a session-reuse arm is not run in this version."

weight:
  exposure:
    method: "equal_within_declared_strata"
    factors: []
    rationale: "No credible audience, intent, locale or surface prevalence evidence exists for AI-assistant travel-connectivity questions. Equal weighting is a conditional convention, not a prevalence estimate."
    normalized_within: "partition x aided_status x lane x surface x locale x wave"
  priority:
    method: "withheld_pending_human_approval"
    factors: []
    rationale: "Strategic priority is a human judgement. No priority weight is applied and no priority-weighted number may be published until Gate 4."

statistics:
  cluster_unit: "canonical_cell_id"
  uncertainty_method: "Wilson intervals for simple unweighted binary strata; stratified cluster bootstrap by canonical_cell_id for any aggregate across cells"
  pilot_status: "pending"
  variance_pilot:
    design: "12 diverse cells - the 4 sentinels plus cell-001, cell-003, cell-008, cell-010, cell-014, cell-016, cell-031 and cell-033 - at 6 repeats per candidate across at least 2 time blocks on 2 surfaces"
    components_to_estimate: ["between_cell", "within_cell_run", "variant_wording", "day_and_time_block", "model_and_surface", "invalid_or_parser"]
    decision_rule: "High within-cell correlation favours adding unique cells; high run variance favours adding repeats. Do not publish subgroup percentages until the pilot runs."
  small_subgroup_rule: "Any stratum with fewer than 20 distinct canonical cells is reported as counts and example responses, never as a percentage leaderboard. Every stratum in this version except core is below that threshold."

refresh_policy:
  evidence_intake: "monthly"
  panel_review: "quarterly, targeting roughly 70-80 percent core, 15-25 percent rotating and 5-10 percent sentinel plus control"
  event_triggered_review: ["target product or plan-structure change", "device-compatibility policy change", "destination coverage or network change", "SIM or eSIM registration regulation change", "model or surface version change", "competitor entry or exit visible in the answer set"]
  charter_review: "annual"
  dated_and_mutable_claim_rules:
    - claim_class: "B5 story and trend cells"
      cell_ids: ["cell-021"]
      review_by: "2026-10-25"
      rule: "Re-verify against evidence published within 90 days of the wave, or demote the cell."
    - claim_class: "price and package facts"
      source_ids: ["source-001", "source-003"]
      review_by: "2026-10-25"
      rule: "Prices rendered in CAD at access time and are geo-dependent. Never embed a price in a prompt; re-verify before any scoring rule references a price."
    - claim_class: "fair-use throttling threshold"
      source_ids: ["source-004"]
      review_by: "2026-10-25"
      rule: "Single independent observation of roughly 3 GB/day and about 1 Mbps. Re-verify per package before treating it as fact in scoring."
    - claim_class: "coverage counts and country lists"
      source_ids: ["source-005"]
      review_by: "2026-09-25"
      rule: "The 137-country figure is dated 2025-09-12 and is stale for scoring; re-verify before use."
    - claim_class: "device compatibility and carrier-lock policy"
      source_ids: ["source-001", "source-004", "source-005"]
      review_by: "2026-10-25"
      rule: "Device lists change with handset releases; re-verify before scoring aided_brand_knowledge."
    - claim_class: "SIM or eSIM identity-registration rules"
      source_ids: ["source-008"]
      review_by: "2026-08-25"
      rule: "Source is undated and names no country. Replace with a dated jurisdictional source or drop cell-023."
next_review: "2026-10-25"

limitations:
  - "Estimates are conditional on this panel and this configuration. They do not represent a probability sample of AI users or of travellers."
  - "Only one first-party buyer-behaviour source (source-006) was reachable. Trustpilot, Reddit, both app stores and travel.stackexchange were blocked or unavailable at access time, so buyer language is thinner than the design intends."
  - "Only 2 of 61 selected candidates are observed language; the rest are evidence-grounded paraphrases. Wording effects are therefore a real risk and are the first thing the variance pilot must measure."
  - "Equal exposure weighting is a convention, not evidence of prevalence. No result may be called market share, audience reach, awareness or share of users."
  - "No priority weights are applied, so no strategic-importance-weighted number exists in this version."
  - "The panel has 25 unaided cells against a 30-48 diagnostic default. Coverage is deliberately short rather than padded."
  - "No non-English locale is measured. en-CA is quarantined pending locale review. Any claim about non-English AI visibility is unsupported."
  - "No campaign lane exists, so no campaign_response estimand, causal claim or before/after attribution is available."
  - "No variance pilot has run, so repetition counts, interval widths and effective sample size are unvalidated."
  - "B5 coverage is one retrieval-only cell on five-month-old evidence; the event-anchored cell was quarantined as decayed."
  - "Company-asserted facts about plans, prices, coverage and device support are mutable and were captured at one moment from one geography."
  - "Reported differences between waves are conditional and non-causal unless a pre-registered experiment justifies more."

