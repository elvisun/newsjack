estimands:
  - name: "unaided_brand_presence"
    numerator: "Valid eligible answers that mention the target brand or a target-owned product name at least once"
    denominator: "All valid observations where partition is core or sentinel AND aided_status is unaided, within one lane, surface, locale and wave"
    eligible_partitions: ["core", "sentinel"]
    eligible_lanes: ["closed_model", "retrieval", "consumer_surface"]
    does_not_prove: "Market share, awareness, audience reach or revenue attribution"
  - name: "competitive_mention_share"
    numerator: "Valid answers naming the target, counted against all supplier brands named across those same answers"
    denominator: "All valid observations where partition is aided AND aided_status is category_aided, within one lane, surface, locale and wave. competitor_aided observations are reported in a separate denominator and are never pooled here."
    eligible_partitions: ["aided"]
    eligible_lanes: ["closed_model", "retrieval"]
    does_not_prove: "Market share or commercial performance"
  - name: "citation_presence"
    numerator: "Valid retrieval-lane answers exposing at least one citation resolving to a target-owned domain"
    denominator: "All valid retrieval-lane observations where retrieval_used is true, within one partition, aided_status, surface, locale and wave"
    eligible_partitions: ["core", "sentinel", "rotating", "aided"]
    eligible_lanes: ["retrieval"]
    does_not_prove: "Referral traffic, clicks or influence on the answer text"
  - name: "aided_brand_knowledge"
    numerator: "Valid answers stating target attributes consistent with dated evidence for destination, device and plan constraints"
    denominator: "All valid observations where partition is aided AND aided_status is target_aided, within one lane, surface, locale and wave"
    eligible_partitions: ["aided"]
    eligible_lanes: ["closed_model", "retrieval"]
    does_not_prove: "That buyers hold the same beliefs, or that the stated facts are currently true"
  - name: "answer_framing"
    numerator: "Valid answers whose structure matches the cell's declared expected_answer_kind"
    denominator: "All valid observations within one canonical cell, lane, surface, locale and wave"
    eligible_partitions: ["core", "sentinel", "rotating", "control", "aided"]
    eligible_lanes: ["closed_model", "retrieval", "consumer_surface"]
    does_not_prove: "Buyer preference or persuasion"

