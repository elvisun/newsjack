model_policy:
  models: "Declare exact provider model IDs and versions at wave start; record whatever version string the provider exposes on every observation."
  temperature: "Fixed, lowest available deterministic setting for closed_model; record the value. Consumer surfaces expose no sampling control; record that as unknown."
  system_prompt: "Fixed empty or minimal fixed developer prompt, identical across cells within a wave; hash it into configuration_hash."
search_policy:
  closed_model: "disabled"
  retrieval: "allowed; record retrieval_used, generated queries when exposed, and citation metadata"
  consumer_surface: "as the product defaults; record whether the UI showed sources"
