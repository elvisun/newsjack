estimands:
  - name: "unaided_brand_presence"
    numerator: "Valid eligible answers mentioning the target at least once"
    denominator: "Valid observations in partitions core+sentinel, aided_status unaided, within one lane, surface, locale, and wave"
    excludes: "control partition, aided partition, rotating partition, invalid or unparsed runs"
  - name: "aided_brand_knowledge"
    numerator: "Valid target-aided answers containing a materially correct, source-checkable target fact"
    denominator: "Valid observations in partition aided with aided_status target_aided, within one lane, surface, locale, and wave"
    excludes: "category_aided and competitor_aided cells, which have their own denominators"
  - name: "competitive_mention_share"
    numerator: "Mentions of one named option within valid unaided answers in the stratum"
    denominator: "All option mentions in the same unaided stratum"
    excludes: "aided partitions and control cells"
  - name: "citation_presence"
    numerator: "Valid retrieval-lane answers exposing at least one target-owned citation"
    denominator: "Valid retrieval-lane observations in the stratum where citations were exposed at all; aided and unaided reported separately"
    excludes: "closed_model and consumer_surface lanes"
  - name: "answer_framing"
    numerator: "Valid answers coded into one fixed framing category"
    denominator: "All valid coded observations in the same partition, aided status, lane, surface, locale, and wave"
    excludes: "cross-partition pooling"
  - name: "control_false_positive_rate"
    numerator: "Control-cell answers mentioning the target"
    denominator: "Valid control-partition observations in the same lane, surface, and wave"
    excludes: "all core, sentinel, rotating, and aided observations"
