limitations:
  - "Estimates are conditional on this panel and do not represent a probability sample of AI users, patients, or practices."
  - "Equal exposure weighting is an assumption, not measured prevalence; no source in the manifest supports weights."
  - "All buyer language is public proxy evidence; no first-party customer corpus, interview, or query-log data was supplied."
  - "The target's root domain and several first-party pages returned HTTP 403, so the contamination lexicon and factual perimeter may be incomplete."
  - "No variance pilot has been run, so repeats and interval widths are defaults."
  - "B5 cells decay; two of the three rest partly on vendor-published dated material."
  - "Aided, unaided, control, and lane observations never share a denominator; do not combine them into one visibility score."
  - "Nothing in this design supports causal claims. A wave-over-wave change is not attribution."
