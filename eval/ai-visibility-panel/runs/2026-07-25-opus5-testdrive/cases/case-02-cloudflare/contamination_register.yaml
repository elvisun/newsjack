warnings:
  - "This register is held OUTSIDE the unaided generation context and is supplied to prompt-set-qa only after generation."
  - "Several target product names are ordinary English words or generic industry categories (Workers, Gateway, Access, Images, Stream, Pages, Queues, Bot Management, Zero Trust, WAF, CDN). Hard-blocking those bare tokens would produce false failures on legitimate category language. They are listed under ambiguous_terms with a required multiword/context match and are routed to human review, never auto-failed."
  - "No campaign terms were supplied by the user. campaign_terms holds target-originated policy framing that must not enter unaided core, not an actual marketing campaign."
  - "people is limited to publicly known co-founder names, recorded solely so that leakage into an unaided prompt is detectable. No other personal data is stored."

