allowed_exceptions:
  - band: B0_direct_brand_product
    partition: aided
    aided_status: target_aided
    term_classes: [brands, products, domains]
    note: "B0 cells must name the target. They live in the aided partition and never enter an unaided denominator."
  - band: B5_broad_discovery_story
    partition: aided
    aided_status: target_aided
    term_classes: [brands, products, proprietary_categories, campaign_terms]
    note: "Applies only to cell-051, the target-aided rendering of the dated 2026-09-15 default change. The matching unaided rendering (cell-032/033) must describe the situation without naming the target or its framing."
  - band: B1_comparison_purchase
    partition: aided
    aided_status: competitor_aided
    term_classes: [competitor_terms]
    note: "Applies only to cell-022 and cell-023. Competitor-named prompts are never counted as unaided."

scan_policy:
  normalization: "NFKC, casefold, collapse whitespace, strip zero-width characters, map common homoglyphs"
  checks:
    - exact_normalized_string
    - token_boundary_match
    - fuzzy_match_edit_distance_2
    - semantic_review_of_slogan_and_flattering_claim_paraphrase
  hard_fail_scope: "Any target_terms or campaign_terms hit in a candidate whose cell has aided_status in [unaided, category_aided, competitor_aided], or in any cell with partition in [core, sentinel, rotating, control]."
  review_scope: "ambiguous_terms hits; semantic paraphrase of a slogan or flattering claim; competitor_terms appearing outside a declared competitor_aided cell."
  auto_delete_permitted: false
