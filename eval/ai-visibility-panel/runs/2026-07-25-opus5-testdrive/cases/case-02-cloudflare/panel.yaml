warnings:
  - "STATUS IS provisional_directional. This is a candidate panel, not a frozen measurement panel. No human has approved any of the four gates, no variance pilot has run, and no exposure-weight evidence exists."
  - "No hashing runtime was available. Every hash field is 'sha256:unavailable'. The panel cannot be frozen until content hashes and a randomization seed are generated."
  - "Nothing in this panel is representative of AI users. The sampling unit is a canonical intent cell chosen by evidence judgement, not a probability sample."
  - "Do not compare rates across aided statuses or lanes. Each has its own denominator by construction."

panel_id: panel-cloudflare-network-platform
version: "0.1.0"
status: provisional_directional
charter_id: charter-cloudflare-2026-07-25
architecture_id: architecture-cloudflare-2026-07-25
