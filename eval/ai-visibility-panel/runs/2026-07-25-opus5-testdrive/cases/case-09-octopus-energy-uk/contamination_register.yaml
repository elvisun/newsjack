allowed_exceptions:
  - band: B0_direct_brand_product
    term_classes: [brands, products, domains]
    rationale: "B0 cells exist to measure aided brand knowledge. They must name the target. Generated in a separate aided pass; never counted in an unaided denominator."
    applies_to_cells: [spec-006, spec-016, spec-022, spec-031]
  - band: B1_comparison_purchase
    term_classes: [competitor_terms]
    rationale: "One declared competitor-aided cell names two large incumbents drawn from source-006, source-007 and source-012. It is a competitor_aided cell with its own denominator and is never merged with unaided results."
    applies_to_cells: [spec-008]
  - band: B2_category
    term_classes: []
    generic_word_decisions:
      - term: "tracker tariff"
        decision: "allowed in one category_aided cell only (spec-005)"
        rationale: "'Tracker' is an ordinary GB market category word used by multiple suppliers, evidenced by a competitor product named in source-012, and appears in consumer guidance. It is nonetheless a substring of a target product name, so it is barred from every unaided cell and permitted only in a declared category_aided cell."
        reviewer: "agent high-confidence decision; flagged for human Gate 3 confirmation"
      - term: "agile"
        decision: "prohibited everywhere"
        rationale: "Too close to a target product name to be safely treated as a generic descriptor. Unaided prompts say 'half-hourly' or 'prices that change every half hour' instead."
      - term: "cosy"
        decision: "prohibited everywhere"
        rationale: "Ordinary English adjective but also a target product name in the heating context; excluded to keep heat pump prompts clean."
      - term: "outgoing" (export sense)
        decision: "prohibited everywhere"
        rationale: "Target export product name; unaided prompts say 'export payments' or 'paid for what I send back'."
      - term: "flexible" (tariff sense)
        decision: "prohibited in tariff naming"
        rationale: "Target standard-variable product name; unaided prompts say 'standard variable' or 'the capped default rate'."
      - term: "intelligent" (tariff sense)
        decision: "prohibited everywhere"
        rationale: "Target smart-tariff family name."
