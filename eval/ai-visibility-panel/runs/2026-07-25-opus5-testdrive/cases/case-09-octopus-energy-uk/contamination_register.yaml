scan_policy:
  normalized: "NFKC, casefold, strip punctuation and internal whitespace runs before matching."
  token: "token-boundary match on every term above."
  fuzzy: "edit distance <= 1 on single-token brand and product terms; flag for review, never auto-delete."
  semantic: "review slogans and flattering claims for paraphrase leakage; any hit requires a recorded review decision."
  hard_failure_scope: "Any target-class match in a cell whose aided_status is unaided or category_aided is a hard failure and a reject. Competitor-class matches in unaided cells are also hard failures."
