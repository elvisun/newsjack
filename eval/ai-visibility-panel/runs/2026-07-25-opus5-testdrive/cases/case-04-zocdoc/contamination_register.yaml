allowed_exceptions:
  - band: B0_direct_brand_product
    term_classes: [brands, products]
    partitions: [aided]
    rationale: "B0 cells are target-aided by definition and must name the target alias to measure aided_brand_knowledge. Their observations use a separate denominator (est-004) and are never pooled with unaided results."
    applies_to_candidate_ids: [prompt-034a, prompt-034b, prompt-035a, prompt-035b, prompt-036a, prompt-036b, prompt-037a, prompt-037b]
  - band: B1_comparison_purchase
    term_classes: [competitor_terms]
    partitions: [aided]
    aided_status: competitor_aided
    rationale: "One competitor-aided cell deliberately names an evidence-supported competitor set (source-007) to observe answer-set composition when the asker supplies rivals. It is aided, uses its own denominator, and must never be counted as unaided."
    applies_to_candidate_ids: [prompt-033a, prompt-033b]
  - band: B2_category
    term_classes: []
    partitions: [aided]
    aided_status: category_aided
    rationale: "B2 cells may name only generic, evidence-supported category nouns ('online doctor appointment booking sites', 'patient acquisition marketplaces'). No proprietary category term is permitted, including 'pay-per-booking'."
  - class: ordinary_language
    terms: [appointment, booking, book, in-network, insurance, availability, marketplace, listing, new patient, dentist, therapist, provider]
    rationale: "These are the ordinary nouns of the category and appear in buyer evidence independent of the target. They are exempt from the lexical scan when used as common nouns and are not treated as target terms."

forbidden_answer_derived_fields:
  - current AI answers, rankings, mention rates or citation rates for the target
  - target content gaps or desired landing pages
  - competitor visibility results
  - campaign copy or launch messaging
  rule: "None of these were available to, or used by, the generation pass. No visibility result of any kind exists yet for this panel, so none could influence prompt selection."

blinding_declaration:
  method: same_context_sanitized_brief
  fresh_subagent_used: false
  reason: "A fresh generation subagent was not invoked in this run. The mitigation was to author blind_design_brief.json first, restrict the unaided generation pass to that brief plus prompt_architecture.json, and then apply this register as a post-hoc deterministic and semantic scan."
  residual_risk: medium
  detected_leakage:
    - candidate_id: prompt-016b
      term_class: proprietary_categories
      term: "pay-per-booking"
      band: B4_job_goal
      partition: core
      aided_status: unaided
      action: reject
      note: "Hard failure. A target proprietary-category phrase entered an unaided core candidate. Rejected, not revised in place, and the loss of variant coverage on cell-016 is recorded as a QA consequence."
  recommended_gate_3_action: "Regenerate the 19 core unaided cells in a fresh context that receives only blind_design_brief.json and prompt_architecture.json, then diff against the current strings. Until that is done, the blinding control should be described as partial."
