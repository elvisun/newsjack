name: Agent Harness Manual

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime install target
        required: true
        default: all
        type: choice
        options:
          - all
          - codex
          - claude
          - hermes
          - openclaw
      production_path:
        description: Use public newsjack.sh installer path
        required: true
        default: false
        type: boolean

jobs:
  installer:
    name: Manual installer harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build harness image
        run: docker build -f harness/Dockerfile -t newsjack-agent-harness:local .

      - name: Run installer harness
        shell: bash
        run: |
          source_flag="--local-source"
          if [ "${{ inputs.production_path }}" = "true" ]; then
            source_flag="--production-path"
          fi

          harness/scripts/run-ci-installer.sh \
            --runtime "${{ inputs.runtime }}" \
            "$source_flag"
