name: Agent Harness Integration

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime to test
        required: true
        default: codex
        type: choice
        options:
          - codex
          - claude
          - hermes
          - openclaw
          - all
      mode:
        description: Token-burning test mode
        required: true
        default: native-smoke
        type: choice
        options:
          - native-smoke
          - acp-smoke
          - setup-flow
      production_path:
        description: Use public newsjack.sh installer path
        required: true
        default: false
        type: boolean

jobs:
  integration:
    name: Token-burning integration harness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # TODO: Reintroduce this workflow as Go or shell orchestration around the
      # newsjack binary. See docs/agent-runtime-harness-plan.md and
      # docs/go-cli-port-plan.md.
      - name: Write integration env file
        shell: bash
        run: |
          umask 077
          {
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
            echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
            echo "MEDIALYST_API_KEY=${{ secrets.MEDIALYST_API_KEY }}"
            echo "MEDIALYST_API_BASE=https://medialyst.ai/api"
            echo "MEDIALYST_NEWS_PATH=/v1/news/search"
            echo "NEWSJACK_HARNESS_ALLOW_MODEL_CALLS=1"
          } > harness/.env.local

      - name: Skip legacy runtime harness
        shell: bash
        run: |
          echo "::notice title=Agent runtime integration skipped::The Python harness runner was removed in the Go-only CLI cleanup. Token-burning runtime coverage will stay disabled until it is rebuilt as Go or shell orchestration around newsjack."
          echo "Requested runtime: ${{ inputs.runtime }}"
          echo "Requested mode: ${{ inputs.mode }}"
          echo "Requested production path: ${{ inputs.production_path }}"
          echo "Secret wiring preserved in harness/.env.local for the future Go/shell harness."
