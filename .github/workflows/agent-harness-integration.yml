name: Agent Harness Manual

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime install target
        required: true
        default: all
        type: choice
        options:
          - all
          - codex
          - claude
          - hermes
          - openclaw
      harnesses:
        description: Comma-separated agent CLIs to preinstall in Docker image
        required: true
        default: all
        type: string
      production_path:
        description: Use public newsjack.sh installer path
        required: true
        default: false
        type: boolean

jobs:
  installer:
    name: Manual installer harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Build harness image
        shell: bash
        run: |
          build_args=()
          IFS=',' read -ra harnesses <<< "${{ inputs.harnesses }}"
          for harness in "${harnesses[@]}"; do
            harness="$(echo "$harness" | xargs)"
            if [ -n "$harness" ]; then
              build_args+=(--harness "$harness")
            fi
          done
          harness/scripts/build-image.sh "${build_args[@]}" --image newsjack-agent-harness:local

      - name: Run installer harness
        shell: bash
        run: |
          source_flag="--local-source"
          if [ "${{ inputs.production_path }}" = "true" ]; then
            source_flag="--production-path"
          fi

          harness/scripts/run-ci-installer.sh \
            --runtime "${{ inputs.runtime }}" \
            "$source_flag"
